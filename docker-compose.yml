services:
  silverbed:
    build: .
    image: silverbed:latest
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      # Supabase / Postgres (leave empty to use the embedded PGlite database)
      DATABASE_URL: ${DATABASE_URL:-}
      # Auth: local | supabase
      AUTH_MODE: ${AUTH_MODE:-local}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      # Storage: local | s3 (MinIO, R2, S3, OSS…)
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - silverbed-data:/data

  # Optional local object storage: set STORAGE_DRIVER=s3 and S3_ENDPOINT=http://minio:9000
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-silverbed}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-silverbed-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  silverbed-data:
  minio-data:
